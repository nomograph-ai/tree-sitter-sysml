# gitlab.com/nomograph/tree-sitter-sysml .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline tree-sitter@v4.1.7
# (gates + tree-sitter test + cargo/npm/pypi publish on tag).
#
# Custom jobs preserved for repo-specific concerns:
#   - parse-coverage: fetches official SysML v2 corpora and measures
#     parse coverage. Repo-specific scripts; not generalizable.
#   - pages: builds the wasm playground for browser-side experimentation.
#   - security templates: SAST + Dependency-Scanning + Secret-Detection
#     (GitLab Ultimate features beyond the deps-scan gate).

default:
  tags: [storr]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

  # Secret detection that BLOCKS, replacing the upstream
  # Jobs/Secret-Detection.gitlab-ci.yml template. That template cannot
  # fail a pipeline on a leaked credential: its analyzer invokes gitleaks
  # with --exit-code 0, so the process exits 0 even when it found
  # secrets, and flipping allow_failure only makes OPERATIONAL faults
  # blocking. secret-verdict runs the same analyzer with the same ruleset
  # (identical scan surface -- this is a swap of the include:, not a
  # change in what gets flagged), then parses
  # gl-secret-detection-report.json, exits nonzero on a non-empty
  # vulnerabilities array, and fails closed when the report is absent.
  - component: gitlab.com/nomograph/pipeline/secret-verdict@v5.10.0
    inputs:
      stage: security
  - component: gitlab.com/nomograph/pipeline/tree-sitter@v5.7.0
    inputs:
      grammar_name: tree-sitter-sysml
      publish_targets: "cargo,npm,pypi"

variables:
  NOMOGRAPH_REGISTRY: registry.gitlab.com/nomograph/pipeline

stages:
  - lint
  - test
  - coverage
  - security
  - publish
  - release
  - pages

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# Override security template stages to land in the security stage.
sast: { stage: security }
dependency_scanning: { stage: security }

# Repo-specific corpus-based parse coverage. Fetches official SysML v2
# training files and measures error rate via test-corpus.sh.
parse-coverage:
  stage: coverage
  image: ${NOMOGRAPH_REGISTRY}/tree-sitter:v5.7.0
  before_script:
    - npm ci
    - npm install -g tree-sitter-cli
    - npx tree-sitter generate
    - bash scripts/fetch-corpora.sh
  script:
    - bash scripts/test-corpus.sh all --errors-only 2>&1 | tee corpus-results.txt
  coverage: '/Parse coverage: (\d+\.?\d*)%/'
  artifacts:
    paths:
      - corpus-results.txt
    expire_in: 30 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Wasm playground for browser-side grammar experimentation.
pages:
  stage: pages
  image: ${NOMOGRAPH_REGISTRY}/tree-sitter:v5.7.0
  before_script:
    - npm ci
  script:
    - npx tree-sitter build --wasm
    - mkdir -p public
    - cp tree-sitter-sysml.wasm public/
    - cp playground/index.html public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
