name: Grammar Coverage

on:
  push:
    branches: [main]
    paths:
      - grammar.js
      - src/**
  pull_request:
    paths:
      - grammar.js
      - src/**
  workflow_dispatch:

jobs:
  coverage:
    name: Parse coverage report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086 # v2

      - name: Generate parser
        run: |
          npm ci
          npx tree-sitter generate

      - name: Fetch test corpora
        run: bash scripts/fetch-corpora.sh

      - name: Run parse coverage
        run: |
          bash scripts/test-corpus.sh all --errors-only 2>&1 | tee corpus-results.txt
          
          echo "## Grammar Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat corpus-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload parse results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-results
          path: corpus-results.txt
